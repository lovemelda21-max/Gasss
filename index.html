<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Rossi | Official Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(244, 63, 94, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 24px;
            border-radius: 24px;
            max-width: 390px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Avatar Container dengan Glow Effect */
        .avatar-container {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(244, 63, 94, 0.6);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #3b82f6;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: 2px solid #030712;
        }

        h1 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .location {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Live Counter Premium */
        .live-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Tombol Premium */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-link:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(244, 63, 94, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: none;
        }

        .btn-link i {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            transition: transform 0.2s;
        }

        .btn-link:hover i {
            transform: translateX(3px);
            color: #fff;
        }

        footer {
            margin-top: 26px;
            font-size: 10px;
            color: #64748b;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Avatar dengan Centang Biru Terverifikasi -->
        <div class="avatar-container">
            <img src="https://6ae49b5608d55966def66d8d.imgix.net/sandbox/1000144556.jpg" alt="Luna Rossi" class="avatar">
            <div class="verified-badge"><i class="fa-solid fa-check"></i></div>
        </div>
        
        <h1>Luna Rossi</h1>
        <div class="location"><i class="fa-solid fa-location-dot"></i> Milan, Italy 🇮🇹</div>
        
        <!-- Indikator Live Visitor -->
        <div class="live-box">
            <div class="pulse-dot"></div>
            <span id="visitor-count">142 active members online</span>
        </div>
        
        <p>Tap below to access my private gallery and connect directly.</p>
        
        <!-- Tombol Interaktif Utama -->
        <a href="#" onclick="redirectUser(event)" class="btn-link">
            <span>💬 Start Private Chat</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
        
        <a href="#" onclick="redirectUser(event)" class="btn-link btn-secondary">
            <span>✨ View Verified Directory</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <footer>Secure &bull; Encrypted Portal &bull; 18+ Only</footer>
    </div>

    <script>
        // Efek dinamis naik-turun angka visitor secara natural agar terlihat hidup
        setInterval(() => {
            const randomCount = Math.floor(Math.random() * (180 - 120 + 1)) + 120;
            document.getElementById('visitor-count').innerText = randomCount + ' active members online';
        }, 5000);

        // [ANTI-BOT CLOAKING] Link CPA dipecah aman di balik skrip JavaScript
        const part1 = "https://safeoffers";
        const part2 = ".pro/a/XDYKZS9";
        const part3 = "zKuD29p";
        
        function redirectUser(e) {
            e.preventDefault();
            // Efek getar mikro (haptic feedback) jika didukung perangkat seluler
            if (navigator.vibrate) {
                navigator.vibrate(40);
            }
            window.location.href = part1 + part2 + part3;
        }
    </script>

</body>
</html>
